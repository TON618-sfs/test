<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>hyprland.lua Generator — Hyprland 0.55+</title>
<style>
  :root{
    --bg:#0e1013; --panel:#15181d; --panel2:#1b1f26; --border:#262b33;
    --fg:#dfe4ea; --dim:#7b8494; --accent:#33ccff; --accent2:#00ff99;
    --warn:#ffb454; --mono:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;line-height:1.5}
  header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;color:var(--accent);letter-spacing:.5px}
  header .sub{color:var(--dim);font-size:12px}
  .layout{display:grid;grid-template-columns:230px 1fr 440px;min-height:calc(100vh - 62px)}
  @media (max-width:1100px){.layout{grid-template-columns:1fr;}}
  nav{border-right:1px solid var(--border);padding:10px 0;overflow-y:auto;max-height:calc(100vh - 62px);position:sticky;top:0}
  nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--dim);
    padding:8px 18px;cursor:pointer;font-family:var(--mono);font-size:12.5px;border-left:2px solid transparent}
  nav button:hover{color:var(--fg);background:var(--panel)}
  nav button.active{color:var(--accent);border-left-color:var(--accent);background:var(--panel)}
  main{padding:20px 26px;overflow-y:auto;max-height:calc(100vh - 62px)}
  .cat{display:none}
  .cat.active{display:block}
  .cat h2{margin:0 0 4px;font-size:15px;color:var(--accent2)}
  .cat .wikinote{color:var(--dim);font-size:11.5px;margin-bottom:16px}
  .field{display:grid;grid-template-columns:22px 1fr 210px;gap:10px;align-items:start;
    padding:9px 10px;border-bottom:1px solid var(--border)}
  .field:hover{background:var(--panel)}
  .field .sig{display:flex;flex-direction:column;gap:3px}
  .field .name{color:var(--fg);font-weight:600}
  .field .sig code{color:var(--accent);font-size:11px}
  .field .desc{color:var(--dim);font-size:11.5px;line-height:1.4}
  .field input[type=checkbox].on{width:16px;height:16px;margin-top:3px;accent-color:var(--accent)}
  .ctrl{display:flex;justify-content:flex-end}
  select,input[type=text],input[type=number]{
    background:var(--panel2);border:1px solid var(--border);color:var(--fg);
    padding:6px 8px;border-radius:4px;font-family:var(--mono);font-size:12px;width:100%;
  }
  select:disabled,input:disabled{opacity:.35}
  .toggle{position:relative;width:38px;height:20px;background:var(--panel2);border:1px solid var(--border);
    border-radius:20px;cursor:pointer;flex-shrink:0}
  .toggle .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:.15s}
  .toggle.checked{background:#0d3a44;border-color:var(--accent)}
  .toggle.checked .knob{left:20px;background:var(--accent)}
  .toggle.disabled{opacity:.35;cursor:not-allowed}
  .repeat-block{border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:14px;background:var(--panel)}
  .repeat-row{display:grid;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border)}
  .repeat-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .row-inline{display:flex;gap:6px;flex-wrap:wrap}
  .row-inline > *{flex:1;min-width:90px}
  .row-hint{color:var(--dim);font-size:11px;margin:2px 0 4px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--border);
    padding:3px 8px;border-radius:12px;font-size:11px;cursor:pointer;user-select:none}
  .chip.on{border-color:var(--accent);color:var(--accent)}
  .btn{background:var(--panel2);border:1px solid var(--border);color:var(--fg);padding:6px 12px;
    border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:11.5px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.danger:hover{border-color:#ff5d5d;color:#ff5d5d}
  .btn.primary{background:var(--accent);color:#00232b;border-color:var(--accent);font-weight:700}
  aside{border-left:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;
    max-height:calc(100vh - 62px)}
  aside .bar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;justify-content:space-between;align-items:center}
  aside .bar .stat{color:var(--dim);font-size:11px}
  #out{flex:1;margin:0;padding:14px;overflow:auto;font-size:11.5px;white-space:pre;color:#c9d6e3}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
  a{color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>⌘ hyprland.lua generator</h1>
  <span class="sub">Hyprland 0.55+ · Lua-конфиг (hl.* API) · подпись + пояснение + переключатель для каждой опции</span>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside>
    <div class="bar">
      <span class="stat" id="stat">0 опций включено</span>
      <div style="display:flex;gap:8px">
        <button class="btn" id="copyBtn">Copy</button>
        <button class="btn primary" id="dlBtn">Download</button>
      </div>
    </div>
    <pre id="out"></pre>
  </aside>
</div>

<script>
/* =========================================================================
   SCHEMA
   Каждая опция = "подпись" (name + lua-путь + тип) + пояснение на русском +
   переключатель "включить в конфиг" (galochka) + контрол (select/текст/число/toggle).
   ========================================================================= */

const BOOL = 'bool', INT='int', FLOAT='float', STR='str', ENUMI='enumi', ENUMS='enums', COLOR='color';

function f(path, label, type, opts){
  return Object.assign({path,label,type,def:null,opts:null,note:''}, opts||{});
}

const CATEGORIES = [
{key:'monitors', title:'Monitors', wiki:'hl.monitor({...}) — wiki.hypr.land/Configuring/Basics/Monitors', repeat:'monitor',
  hint:'Описывает физические мониторы: какой выход, разрешение/частота, позиция в общем пространстве и масштаб. Можно добавить несколько строк — по одной на монитор (или одну с пустым output для «все мониторы»).'},
{key:'autostart', title:'Autostart / Exec', wiki:'hl.on("hyprland.start", function() hl.exec_cmd(...) end)', repeat:'exec',
  hint:'Команды, которые запускаются один раз при старте Hyprland — панель (waybar), обои, апплеты, демон уведомлений и т.д. Каждая строка — отдельная команда.'},
{key:'env', title:'Environment variables', wiki:'hl.env(key, value)', repeat:'env',
  hint:'Переменные окружения, которые Hyprland выставит перед запуском сессии — размер курсора, бэкенд Qt/GTK, переменные для Nvidia и т.п.'},
{key:'general', title:'general', wiki:'hl.config({ general = {...} })', fields:[
  f('general.gaps_in','gaps_in',INT,{def:5,note:'Зазор (в пикселях) между соседними окнами внутри воркспейса.'}),
  f('general.gaps_out','gaps_out',INT,{def:20,note:'Зазор (в пикселях) между окнами и краем экрана.'}),
  f('general.gaps_workspaces','gaps_workspaces',INT,{def:0,note:'Дополнительный отступ между соседними воркспейсами при свайпе/анимации переключения.'}),
  f('general.border_size','border_size',INT,{def:2,note:'Толщина рамки окна в пикселях.'}),
  f('general.no_border_on_floating','no_border_on_floating',BOOL,{def:false,note:'Если включено — у плавающих (floating) окон рамка не рисуется.'}),
  f('general.resize_on_border','resize_on_border',BOOL,{def:false,note:'Позволяет менять размер окна, зажав ЛКМ на рамке/зазоре, без модификатора.'}),
  f('general.extend_border_grab_area','extend_border_grab_area',INT,{def:15,note:'Насколько пикселей область «захвата» рамки шире самой рамки — удобнее попадать курсором для resize_on_border.'}),
  f('general.hover_icon_on_border','hover_icon_on_border',BOOL,{def:true,note:'Показывать иконку курсора «resize» при наведении на рамку окна.'}),
  f('general.allow_tearing','allow_tearing',BOOL,{def:false,note:'Разрешает screen tearing для окон/игр с tearing-режимом (см. wiki/Tearing) — снижает задержку ввода, но может рвать кадр.'}),
  f('general.layout','layout',ENUMS,{def:'dwindle',opts:['dwindle','master','scrolling'],note:'Тайловый layout по умолчанию для новых воркспейсов: dwindle (бинарное дерево), master (мастер+стек) или scrolling (горизонтальная лента колонок).'}),
  f('general.snap.enabled','snap.enabled',BOOL,{def:false,note:'Включает «прилипание» окон друг к другу и к краям экрана при перетаскивании/ресайзе мышью.'}),
  f('general.snap.window_gap','snap.window_gap',INT,{def:10,note:'Максимальное расстояние (px) до соседнего окна, при котором сработает прилипание.'}),
  f('general.snap.monitor_gap','snap.monitor_gap',INT,{def:10,note:'Максимальное расстояние (px) до края монитора, при котором сработает прилипание.'}),
  f('general.snap.border_overlap','snap.border_overlap',BOOL,{def:false,note:'Если включено, рамки прилипших окон накладываются друг на друга, а не стоят впритык.'}),
]},
{key:'colors', title:'general.col (цвета рамок)', wiki:'подкатегория general.col', fields:[
  f('general.col.active_border','active_border, цвет 1',COLOR,{def:'rgba(33ccffee)',note:'Цвет рамки у активного (сфокусированного) окна. Формат rgba(RRGGBBAA) / rgb(RRGGBB).'}),
  f('general.col.active_border2','active_border, цвет 2 (градиент)',COLOR,{def:'rgba(00ff99ee)',note:'Второй цвет — если указан, рамка активного окна рисуется градиентом между цветом 1 и цветом 2. Оставьте пустым для однотонной рамки.'}),
  f('general.col.active_angle','active_border, угол градиента',INT,{def:45,note:'Угол (в градусах) направления градиента рамки активного окна. Имеет смысл только если задан второй цвет.'}),
  f('general.col.inactive_border','inactive_border',COLOR,{def:'rgba(595959aa)',note:'Цвет рамки у неактивных (не в фокусе) окон.'}),
]},
{key:'decoration', title:'decoration', wiki:'hl.config({ decoration = {...} })', fields:[
  f('decoration.rounding','rounding',INT,{def:10,note:'Радиус скругления углов окна в пикселях. 0 — острые углы.'}),
  f('decoration.rounding_power','rounding_power',FLOAT,{def:2,note:'«Степень» кривой скругления — при значениях >2 угол становится больше похож на суперэллипс (более плавный), чем на классическую окружность.'}),
  f('decoration.active_opacity','active_opacity',FLOAT,{def:1.0,note:'Прозрачность активного окна: 1.0 — непрозрачно, 0.0 — полностью прозрачно.'}),
  f('decoration.inactive_opacity','inactive_opacity',FLOAT,{def:1.0,note:'Прозрачность неактивных окон.'}),
  f('decoration.fullscreen_opacity','fullscreen_opacity',FLOAT,{def:1.0,note:'Прозрачность окна в полноэкранном режиме.'}),
  f('decoration.dim_inactive','dim_inactive',BOOL,{def:false,note:'Затемнять неактивные окна, чтобы визуально выделить окно в фокусе.'}),
  f('decoration.dim_strength','dim_strength',FLOAT,{def:0.5,note:'Сила затемнения неактивных окон (0..1), если dim_inactive включён.'}),
  f('decoration.dim_special','dim_special',FLOAT,{def:0.2,note:'Затемнение окон позади открытого специального (scratchpad) воркспейса.'}),
  f('decoration.dim_around','dim_around',FLOAT,{def:0.4,note:'Затемнение фона вокруг окна, у которого явно включено правило dim_around (например, окно с pop-up меню).'}),
  f('decoration.border_part_of_window','border_part_of_window',BOOL,{def:true,note:'Считать ли рамку частью геометрии окна (влияет на расчёты размеров/тайлинга).'}),
  f('decoration.screen_shader','screen_shader',STR,{def:'',note:'Путь к пользовательскому .frag GLSL-шейдеру для постобработки всего экрана (например, ночной режим). Оставьте пустым, если не нужно.'}),
]},
{key:'shadow', title:'decoration.shadow', wiki:'подкатегория decoration.shadow', fields:[
  f('decoration.shadow.enabled','enabled',BOOL,{def:true,note:'Включает отрисовку тени под окнами.'}),
  f('decoration.shadow.range','range',INT,{def:4,note:'«Дальность» распространения тени в пикселях (насколько она растянута/размыта).'}),
  f('decoration.shadow.render_power','render_power',INT,{def:3,note:'Качество/резкость рендера тени (1..4) — выше значит более плавный градиент, но дороже по GPU.'}),
  f('decoration.shadow.color','color',COLOR,{def:'0xee1a1a1a',note:'Цвет тени активного/обычного окна в формате 0xAARRGGBB.'}),
  f('decoration.shadow.color_inactive','color_inactive',COLOR,{def:'',note:'Отдельный цвет тени для неактивных окон. Пусто — использовать тот же цвет, что и у активных.'}),
  f('decoration.shadow.offset_x','offset.x',INT,{def:0,note:'Смещение тени по горизонтали (px).'}),
  f('decoration.shadow.offset_y','offset.y',INT,{def:0,note:'Смещение тени по вертикали (px).'}),
  f('decoration.shadow.scale','scale',FLOAT,{def:1.0,note:'Масштаб тени относительно размера окна (0..1).'}),
  f('decoration.shadow.ignore_window','ignore_window',BOOL,{def:true,note:'Рисовать тень, даже если само окно не рендерится (например, скрыто за другим).'}),
  f('decoration.shadow.sharp','sharp',BOOL,{def:false,note:'Резкая тень без размытия по краям вместо мягкого градиента.'}),
]},
{key:'blur', title:'decoration.blur', wiki:'подкатегория decoration.blur', fields:[
  f('decoration.blur.enabled','enabled',BOOL,{def:true,note:'Включает Kawase-блюр фона за прозрачными окнами.'}),
  f('decoration.blur.size','size',INT,{def:3,note:'Размер (радиус) одного прохода блюра. Больше — сильнее размытие.'}),
  f('decoration.blur.passes','passes',INT,{def:1,note:'Количество проходов блюра. При увеличении size стоит увеличивать и passes, иначе размытие выглядит «ступенчато».'}),
  f('decoration.blur.ignore_opacity','ignore_opacity',BOOL,{def:true,note:'Применять блюр независимо от значения opacity окна.'}),
  f('decoration.blur.new_optimizations','new_optimizations',BOOL,{def:true,note:'Новый более быстрый алгоритм блюра — рекомендуется оставить включённым.'}),
  f('decoration.blur.xray','xray',BOOL,{def:false,note:'«Рентген»-режим: размывает то, что находится непосредственно под окном, а не весь фон за стеком слоёв.'}),
  f('decoration.blur.noise','noise',FLOAT,{def:0.0117,note:'Количество шума/зерна, добавляемого поверх блюра (для более «живого» стекла).'}),
  f('decoration.blur.contrast','contrast',FLOAT,{def:0.8916,note:'Контраст размытого фона.'}),
  f('decoration.blur.brightness','brightness',FLOAT,{def:0.8172,note:'Яркость размытого фона.'}),
  f('decoration.blur.vibrancy','vibrancy',FLOAT,{def:0.1696,note:'Насыщенность цвета размытого фона («живость» цветов сквозь стекло»).'}),
  f('decoration.blur.vibrancy_darkness','vibrancy_darkness',FLOAT,{def:0.0,note:'Насколько vibrancy сильнее проявляется в тёмных участках фона.'}),
  f('decoration.blur.special','special',BOOL,{def:false,note:'Размывать фон и для специального (scratchpad) воркспейса.'}),
  f('decoration.blur.popups','popups',BOOL,{def:false,note:'Размывать фон под всплывающими окнами (popups), например тултипами.'}),
  f('decoration.blur.input_methods','input_methods',BOOL,{def:false,note:'Размывать фон под окнами ввода (виртуальные клавиатуры, IME).'}),
]},
{key:'animations', title:'animations', wiki:'hl.config({animations={...}}) + hl.curve()/hl.animation()', fields:[
  f('animations.enabled','enabled',BOOL,{def:true,note:'Глобальный переключатель всех анимаций Hyprland.'}),
  f('animations.first_launch_animation','first_launch_animation',BOOL,{def:true,note:'Проигрывать приветственную анимацию при самом первом запуске Hyprland.'}),
  f('animations.preset','набор кривых/анимаций по умолчанию',BOOL,{def:true,special:'preset',note:'Добавляет стандартный набор hl.curve()/hl.animation() (easeOutQuint, плавные окна, воркспейсы и т.д.) — как в официальном примере Hyprland. Выключите, если хотите писать анимации сами.'}),
]},
{key:'dwindle', title:'dwindle', wiki:'hl.config({dwindle={...}}) — layouts/Dwindle', fields:[
  f('dwindle.pseudotile','pseudotile',BOOL,{def:false,note:'Позволяет окну сохранять «псевдо» (произвольный) размер внутри тайла, а не растягиваться на весь слот.'}),
  f('dwindle.force_split','force_split',ENUMI,{def:0,opts:[[0,'0 — по позиции курсора'],[1,'1 — всегда левое/верхнее'],[2,'2 — всегда правое/нижнее']],note:'Куда добавляется новое окно при делении текущего слота.'}),
  f('dwindle.preserve_split','preserve_split',BOOL,{def:true,note:'Сохранять ориентацию сплита при закрытии окон, а не пересчитывать дерево заново. Почти всегда нужно включённым.'}),
  f('dwindle.smart_split','smart_split',BOOL,{def:false,note:'«Умное» разделение по положению курсора внутри окна, а не только по горизонтали/вертикали слота.'}),
  f('dwindle.smart_resizing','smart_resizing',BOOL,{def:true,note:'При ресайзе мышью двигать ближайшую к курсору границу, а не всегда последнюю созданную.'}),
  f('dwindle.permanent_direction_override','permanent_direction_override',BOOL,{def:false,note:'Зафиксировать направление следующего сплита (заданное биндом) навсегда, а не только для одного следующего окна.'}),
  f('dwindle.special_scale_factor','special_scale_factor',FLOAT,{def:1.0,note:'Масштаб окон на специальном (scratchpad) воркспейсе относительно обычного размера.'}),
  f('dwindle.split_width_multiplier','split_width_multiplier',FLOAT,{def:1.0,note:'Множитель, влияющий на то, при каком соотношении сторон окна сплит становится горизонтальным, а не вертикальным.'}),
  f('dwindle.use_active_for_splits','use_active_for_splits',BOOL,{def:true,note:'Использовать активное окно (а не то, что под курсором) как точку деления для нового окна.'}),
  f('dwindle.default_split_ratio','default_split_ratio',FLOAT,{def:1.0,note:'Начальное соотношение сторон при делении слота (1.0 = 50/50).'}),
  f('dwindle.split_bias','split_bias',ENUMI,{def:0,opts:[[0,'0'],[1,'1'],[2,'2']],note:'Дополнительное смещение точки сплита относительно курсора/окна.'}),
]},
{key:'master', title:'master', wiki:'hl.config({master={...}}) — layouts/Master', fields:[
  f('master.allow_small_split','allow_small_split',BOOL,{def:false,note:'Разрешает создавать дополнительный небольшой сплит внутри мастер-области.'}),
  f('master.special_scale_factor','special_scale_factor',FLOAT,{def:1.0,note:'Масштаб окон на специальном (scratchpad) воркспейсе.'}),
  f('master.mfact','mfact',FLOAT,{def:0.55,note:'Доля экрана, которую занимает мастер-окно (0..1). 0.55 = 55% под мастер, 45% под стек.'}),
  f('master.new_status','new_status',ENUMS,{def:'master',opts:['master','slave','inherit'],note:'Каким становится новое окно: master — сразу мастером, slave — уходит в стек, inherit — наследует статус окна, из которого было открыто.'}),
  f('master.new_on_top','new_on_top',BOOL,{def:false,note:'Добавлять новые окна в стек сверху, а не снизу.'}),
  f('master.new_on_active','new_on_active',ENUMS,{def:'none',opts:['none','before','after'],note:'Куда относительно текущего активного окна вставлять новое: до, после или без привязки.'}),

/* ---------- field renderer (подпись + пояснение + toggle + контрол) ---------- */
function renderField(fl){
  const row = document.createElement('div'); row.className='field';
  const cb = document.createElement('input'); cb.type='checkbox'; cb.className='on';
  cb.checked = state.on[fl.path];

  const sig = document.createElement('div'); sig.className='sig';
  const typeName = {bool:'boolean',int:'int',float:'float',str:'string',enumi:'int·enum',enums:'string·enum',color:'color'}[fl.type];
  sig.innerHTML = `<span class="name">${fl.label}</span><code>${fl.path} : ${typeName}</code>` +
                  (fl.note?`<span class="desc">${fl.note}</span>`:'');

  const ctrl = document.createElement('div'); ctrl.className='ctrl';
  const ctrlEl = makeControl(fl, ()=>{ state.on[fl.path]=true; cb.checked=true; applyEnabled(); build(); });
  ctrl.appendChild(ctrlEl);

  function applyEnabled(){
    if(fl.type===BOOL){
      ctrlEl.classList.toggle('disabled', !cb.checked);
    } else {
      ctrl.querySelectorAll('select,input').forEach(x=>x.disabled=!cb.checked);
    }
  }
  cb.onchange = ()=>{ state.on[fl.path]=cb.checked; applyEnabled(); build(); };
  applyEnabled();

  row.append(cb, sig, ctrl);
  return row;
}

function makeControl(fl, onEdit){
  if(fl.type===BOOL){
    const t=document.createElement('div'); t.className='toggle'+(state.val[fl.path]?' checked':'');
    t.innerHTML='<div class="knob"></div>';
    t.onclick=()=>{
      if(t.classList.contains('disabled')) return;
      state.val[fl.path]=!state.val[fl.path];
      t.classList.toggle('checked', state.val[fl.path]);
      onEdit();
    };
    return t;
  }
  if(fl.type===INT || fl.type===FLOAT){
    const inp=document.createElement('input'); inp.type='number'; inp.value=fl.def;
    if(fl.type===FLOAT) inp.step='0.01';
    inp.oninput=()=>{ state.val[fl.path]= fl.type===INT? parseInt(inp.value||0) : parseFloat(inp.value||0); onEdit(); };
    return inp;
  }
  if(fl.type===STR || fl.type===COLOR){
    const inp=document.createElement('input'); inp.type='text'; inp.value=fl.def; inp.placeholder=fl.type===COLOR?'rgba(...) / 0x...':'';
    inp.oninput=()=>{ state.val[fl.path]=inp.value; onEdit(); };
    return inp;
  }
  if(fl.type===ENUMS){
    const sel=document.createElement('select');
    fl.opts.forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; sel.appendChild(op); });
    sel.value=fl.def;
    sel.onchange=()=>{ state.val[fl.path]=sel.value; onEdit(); };
    return sel;
  }
  if(fl.type===ENUMI){
    const sel=document.createElement('select');
    fl.opts.forEach(([v,label])=>{ const op=document.createElement('option'); op.value=v; op.textContent=label; sel.appendChild(op); });
    sel.value=fl.def;
    sel.onchange=()=>{ state.val[fl.path]=parseInt(sel.value); onEdit(); };
    return sel;
  }
  return document.createElement('span');
}

/* =========================================================================
   REPEATABLE SECTIONS (мониторы, автозапуск, env, жесты, устройства, бинды, правила)
   ========================================================================= */
function renderRepeat(kind){
  const wrap = document.createElement('div');
  const list = document.createElement('div'); list.className='repeat-block';
  const addBtn = document.createElement('button'); addBtn.className='btn'; addBtn.textContent='+ добавить строку';
  addBtn.onclick=()=>{ addRow(kind); redraw(); };
  wrap.append(list, addBtn);

  function redraw(){
    list.innerHTML='';
    repeats[kind].forEach((row,idx)=>{
      list.appendChild(renderRow(kind,row,idx,redraw));
    });
    if(repeats[kind].length===0){ const p=document.createElement('div'); p.className='desc'; p.textContent='(пусто — нажмите «+ добавить строку»)'; list.appendChild(p); }
    build();
  }
  redraw();
  return wrap;
}

function addRow(kind){
  const defaults = {
    monitor:{output:'',mode:'preferred',position:'auto',scale:'auto',res:'1920x1080@60'},
    exec:{cmd:''},
    env:{key:'',val:''},
    gesture:{fingers:3,direction:'horizontal',action:'workspace'},
    device:{name:'',sensitivity:0,accel_profile:''},
    bind:{mods:['SUPER'],key:'',disp:'exec',arg:'',flags:[]},
    windowrule:{name:'',match:'class = ".*"',type:'float',value:''},
    workspacerule:{workspace:'',monitor:'',default:false,no_border:false,no_rounding:false,decorate:true,gaps_in:'',gaps_out:''},
    layerrule:{namespace:'',no_anim:false,blur:false,ignore_alpha:'',dim_around:false},
  };
  repeats[kind].push(JSON.parse(JSON.stringify(defaults[kind])));
}

function renderRow(kind,row,idx,redraw){
  const r = document.createElement('div'); r.className='repeat-row';
  const line = document.createElement('div'); line.className='row-inline';
  const del = document.createElement('button'); del.className='btn danger'; del.textContent='✕';
  del.onclick=()=>{ repeats[kind].splice(idx,1); redraw(); };

  function txt(val, ph, onChange){
    const i=document.createElement('input'); i.type='text'; i.value=val; i.placeholder=ph||'';
    i.oninput=()=>{ onChange(i.value); build(); };
    return i;
  }
  function sel(options, val, onChange, onSelChangeAlsoRedraw){
    const s=document.createElement('select');
    options.forEach(o=>{ const op=document.createElement('option'); op.value=o[0]??o; op.textContent=o[1]??o; s.appendChild(op); });
    s.value=val;
    s.onchange=()=>{ onChange(s.value); if(onSelChangeAlsoRedraw) redraw(); else build(); };
    return s;
  }
  function chk(label, val, onChange){
    const c=document.createElement('span'); c.className='chip'+(val?' on':'');
    c.textContent=label;
    c.onclick=()=>{ val=!val; c.classList.toggle('on'); onChange(val); build(); };
    return c;
  }
  function hint(text){
    const d=document.createElement('div'); d.className='row-hint'; d.textContent=text;
    return d;
  }

  if(kind==='monitor'){
    r.appendChild(hint('output: имя выхода (напр. DP-1) или пусто = все мониторы · mode: режим/разрешение · position: позиция в общем пространстве (auto / "0x0") · scale: масштаб (auto / 1 / 1.5)'));
    line.append(
      txt(row.output,'output (пусто = все)',v=>row.output=v),
      sel([['preferred','preferred (родное разрешение)'],['highres','highres (макс. доступное)'],['custom','свой (custom) resolution@rate']],row.mode,v=>row.mode=v, true),
      txt(row.position,'auto / 0x0',v=>row.position=v),
      txt(row.scale,'auto / 1 / 1.5',v=>row.scale=v),
    );
    if(row.mode==='custom') line.appendChild(txt(row.res||'1920x1080@60','1920x1080@144',v=>row.res=v));
  }
  if(kind==='exec'){
    r.appendChild(hint('Команда запускается один раз при старте Hyprland.'));
    line.append(txt(row.cmd,'команда, напр. waybar',v=>row.cmd=v));
  }
  if(kind==='env'){
    r.appendChild(hint('Имя переменной окружения и её значение, напр. XCURSOR_SIZE = 24.'));
    line.append(txt(row.key,'KEY',v=>row.key=v), txt(row.val,'value',v=>row.val=v));
  }
  if(kind==='gesture'){
    r.appendChild(hint('Количество пальцев, направление свайпа и что он делает.'));
    line.append(
      sel([[2,'2 пальца'],[3,'3 пальца'],[4,'4 пальца']],row.fingers,v=>row.fingers=parseInt(v)),
      sel([['horizontal','horizontal — свайп влево/вправо'],['vertical','vertical — свайп вверх/вниз']],row.direction,v=>row.direction=v),
      sel([['workspace','workspace — перелистывание воркспейсов'],['fullscreen','fullscreen — переключить полноэкранный режим'],['float','float — переключить плавающий режим']],row.action,v=>row.action=v),
    );
  }
  if(kind==='device'){
    r.appendChild(hint('Точное имя устройства смотрите командой `hyprctl devices` в терминале.'));
    line.append(
      txt(row.name,'напр. epic-mouse-v1',v=>row.name=v),
      txt(row.sensitivity,'sensitivity -1..1',v=>row.sensitivity=v),
      txt(row.accel_profile,'accel_profile: flat/adaptive',v=>row.accel_profile=v),
    );
  }
  if(kind==='bind'){
    r.appendChild(hint('Модификаторы + клавиша запускают выбранное действие (диспетчер). Флаги: locked — работает даже на экране блокировки, repeating — повтор при удержании, mouse — бинд на кнопку мыши (для drag/resize).'));
    const modsRow = document.createElement('div'); modsRow.className='row-inline';
    ['SUPER','SHIFT','CTRL','ALT'].forEach(m=>{
      modsRow.appendChild(chk(m, row.mods.includes(m), on=>{
        if(on && !row.mods.includes(m)) row.mods.push(m);
        if(!on) row.mods = row.mods.filter(x=>x!==m);
      }));
    });
    r.appendChild(modsRow);
    line.append(
      txt(row.key,'клавиша: Q / left / mouse_down',v=>row.key=v),
      sel(DISPATCHERS.map(d=>[d[0],d[0]]),row.disp,v=>row.disp=v, true),
      txt(row.arg,'аргумент (команда/направление/№)',v=>row.arg=v),
    );
    const flagsRow=document.createElement('div'); flagsRow.className='row-inline';
    ['locked','repeating','mouse'].forEach(fl=>{
      flagsRow.appendChild(chk(fl, row.flags.includes(fl), on=>{
        if(on && !row.flags.includes(fl)) row.flags.push(fl);
        if(!on) row.flags = row.flags.filter(x=>x!==fl);
      }));
    });
    r.appendChild(flagsRow);
    const dInfo = DISPATCHERS.find(d=>d[0]===row.disp);
    r.appendChild(hint(dInfo?dInfo[2]:''));
  }
  if(kind==='windowrule'){
    r.appendChild(hint('match — по каким признакам находить окно, напр. class = "firefox" или title = "^Picture-in-Picture$" (регулярные выражения).'));
    line.append(
      txt(row.name,'уникальное имя правила',v=>row.name=v),
      txt(row.match,'class = "firefox"',v=>row.match=v),
      sel(WR_TYPES.map(t=>[t[0],t[0]]),row.type,v=>row.type=v, true),
      txt(row.value,'значение (если нужно)',v=>row.value=v),
    );
    const wInfo = WR_TYPES.find(t=>t[0]===row.type);
    r.appendChild(hint(wInfo?wInfo[1]:''));
  }
  if(kind==='workspacerule'){
    r.appendChild(hint('workspace: номер, "name:имя" или "special:имя". monitor — закрепить воркспейс за конкретным выходом.'));
    line.append(
      txt(row.workspace,'"3" / "name:coding" / "special:x"',v=>row.workspace=v),
      txt(row.monitor,'DP-1 (опц.)',v=>row.monitor=v),
      txt(row.gaps_in,'gaps_in (опц.)',v=>row.gaps_in=v),
      txt(row.gaps_out,'gaps_out (опц.)',v=>row.gaps_out=v),
    );
    const flagsRow=document.createElement('div'); flagsRow.className='row-inline';
    [['default','default — воркспейс по умолчанию для монитора'],['no_border','no_border — без рамок'],['no_rounding','no_rounding — без скруглений'],['decorate','decorate — рисовать декорации']].forEach(([k,label])=>{
      flagsRow.appendChild(chk(label, row[k], on=>row[k]=on));
    });
    r.appendChild(flagsRow);
  }
  if(kind==='layerrule'){
    r.appendChild(hint('namespace — регулярное выражение для имени layer-поверхности (панель, меню, уведомление). Узнать namespace можно в логах Hyprland.'));
    line.append(txt(row.namespace,'^my-overlay$',v=>row.namespace=v));
    const flagsRow=document.createElement('div'); flagsRow.className='row-inline';
    [['no_anim','no_anim — без анимации'],['blur','blur — размывать фон за слоем'],['dim_around','dim_around — затемнять фон вокруг']].forEach(([k,label])=>{
      flagsRow.appendChild(chk(label, row[k], on=>row[k]=on));
    });
    r.appendChild(flagsRow);
  }

  r.appendChild(line);
  const top=document.createElement('div'); top.style.display='flex'; top.style.justifyContent='flex-end';
  top.appendChild(del);
  r.prepend(top);
  return r;
}

/* =========================================================================
   BUILD OUTPUT
   ========================================================================= */
function luaLit(fl,val){
  if(fl.type===BOOL) return val?'true':'false';
  if(fl.type===INT || fl.type===ENUMI) return String(parseInt(val));
  if(fl.type===FLOAT) return String(val);
  return `"${String(val).replace(/"/g,'\\"')}"`;
}

function setPath(obj, path, litValue){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){
    cur[parts[i]] = cur[parts[i]] || {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length-1]] = {__lit:litValue};
}

function serialize(obj, indent){
  const pad2 = '  '.repeat(indent+1);
  let lines = [];
  for(const key of Object.keys(obj)){
    const v = obj[key];
    if(v && v.__lit!==undefined){
      lines.push(`${pad2}${key} = ${v.__lit},`);
    } else {
      lines.push(`${pad2}${key} = {`);
      lines.push(serialize(v, indent+1));
      lines.push(`${pad2}},`);
    }
  }
  return lines.join('\n');
}

function build(){
  let out = [];
  out.push('-- ============================================================');
  out.push('-- hyprland.lua — сгенерировано конфигуратором (Hyprland 0.55+)');
  out.push('-- Разместить в: ~/.config/hypr/hyprland.lua');
  out.push('-- https://wiki.hypr.land/Configuring/Start/');
  out.push('-- ============================================================\n');

  // MONITORS
  if(repeats.monitor.length){
    out.push('------------------\n---- MONITORS ----\n------------------');
    repeats.monitor.forEach(m=>{
      const mode = m.mode==='custom' ? (m.res||'1920x1080@60') : m.mode;
      out.push(`hl.monitor({ output = "${m.output}", mode = "${mode}", position = "${m.position}", scale = "${m.scale}" })`);
    });
    out.push('');
  }

  // AUTOSTART
  if(repeats.exec.length){
    out.push('-------------------\n---- AUTOSTART ----\n-------------------');
    out.push('hl.on("hyprland.start", function()');
    repeats.exec.forEach(e=>{ if(e.cmd) out.push(`    hl.exec_cmd("${e.cmd.replace(/"/g,'\\"')}")`); });
    out.push('end)\n');
  }

  // ENV
  if(repeats.env.length){
    out.push('-------------------------------\n---- ENVIRONMENT VARIABLES ----\n-------------------------------');
    repeats.env.forEach(e=>{ if(e.key) out.push(`hl.env("${e.key}", "${e.val}")`); });
    out.push('');
  }

  // hl.config({...}) из generic-полей (все категории с `fields`)
  const cfgObj = {};
  let anyCfg = false;
  CATEGORIES.forEach(cat=>{
    if(!cat.fields) return;
    cat.fields.forEach(fl=>{
      if(!state.on[fl.path]) return;
      if(fl.path==='animations.preset') return;           // обрабатывается отдельно ниже
      if(fl.path.startsWith('general.col.')) return;       // обрабатывается отдельным спец-блоком ниже
      anyCfg = true;
      setPath(cfgObj, fl.path, luaLit(fl, state.val[fl.path]));
    });
  });
  // спец-обработка general.col.* — сборка градиента/цвета рамки
  if(state.on['general.col.active_border'] || state.on['general.col.active_border2'] || state.on['general.col.active_angle']){
    const c1 = state.val['general.col.active_border']||'rgba(33ccffee)';
    const c2 = state.val['general.col.active_border2'];
    const angle = state.val['general.col.active_angle']??45;
    cfgObj.general = cfgObj.general || {};
    cfgObj.general.col = cfgObj.general.col || {};
    if(c2 && c2.trim()!==''){
      cfgObj.general.col.active_border = {__lit:`{ colors = {"${c1}", "${c2}"}, angle = ${angle} }`};
    } else {
      cfgObj.general.col.active_border = {__lit:`"${c1}"`};
    }
    anyCfg = true;
  }
  if(state.on['general.col.inactive_border']){
    cfgObj.general = cfgObj.general || {};
    cfgObj.general.col = cfgObj.general.col || {};
    cfgObj.general.col.inactive_border = {__lit:`"${state.val['general.col.inactive_border']}"`};
    anyCfg = true;
  }

  if(anyCfg){
    out.push('-----------------------\n---- LOOK AND FEEL / OPTIONS ----\n-----------------------');
    out.push('hl.config({');
    out.push(serialize(cfgObj,0));
    out.push('})\n');
  }

  // пресет анимаций
  if(state.on['animations.preset'] && state.val['animations.preset']){
    out.push('-- Стандартные кривые и анимации, см. Configuring/Advanced-and-Cool/Animations');
    out.push(`hl.curve("easeOutQuint", { type = "bezier", points = { {0.23, 1}, {0.32, 1} } })`);
    out.push(`hl.curve("easeInOutCubic", { type = "bezier", points = { {0.65, 0.05}, {0.36, 1} } })`);
    out.push(`hl.curve("linear", { type = "bezier", points = { {0, 0}, {1, 1} } })`);
    out.push(`hl.curve("almostLinear", { type = "bezier", points = { {0.5, 0.5}, {0.75, 1} } })`);
    out.push(`hl.curve("quick", { type = "bezier", points = { {0.15, 0}, {0.1, 1} } })`);
    out.push(`hl.curve("easy", { type = "spring", mass = 1, stiffness = 71.2633, dampening = 15.8273644 })`);
    out.push(`hl.animation({ leaf = "global", enabled = true, speed = 10, bezier = "default" })`);
    out.push(`hl.animation({ leaf = "border", enabled = true, speed = 5.39, bezier = "easeOutQuint" })`);
    out.push(`hl.animation({ leaf = "windows", enabled = true, speed = 4.79, spring = "easy" })`);
    out.push(`hl.animation({ leaf = "windowsIn", enabled = true, speed = 4.1, spring = "easy", style = "popin 87%" })`);
    out.push(`hl.animation({ leaf = "windowsOut", enabled = true, speed = 1.49, bezier = "linear", style = "popin 87%" })`);
    out.push(`hl.animation({ leaf = "fadeIn", enabled = true, speed = 1.73, bezier = "almostLinear" })`);
    out.push(`hl.animation({ leaf = "fadeOut", enabled = true, speed = 1.46, bezier = "almostLinear" })`);
    out.push(`hl.animation({ leaf = "fade", enabled = true, speed = 3.03, bezier = "quick" })`);
    out.push(`hl.animation({ leaf = "layers", enabled = true, speed = 3.81, bezier = "easeOutQuint" })`);
    out.push(`hl.animation({ leaf = "workspaces", enabled = true, speed = 1.94, bezier = "almostLinear", style = "fade" })`);
    out.push(`hl.animation({ leaf = "zoomFactor", enabled = true, speed = 7, bezier = "quick" })`);
    out.push('');
  }

  // жесты
  if(repeats.gesture.length){
    out.push('---------------\n---- GESTURES ----\n---------------');
    repeats.gesture.forEach(g=>{
      out.push(`hl.gesture({ fingers = ${g.fingers}, direction = "${g.direction}", action = "${g.action}" })`);
    });
    out.push('');
  }

  // устройства
  if(repeats.device.length){
    out.push('---------------\n---- DEVICES ----\n---------------');
    repeats.device.forEach(d=>{
      if(!d.name) return;
      let props = [`name = "${d.name}"`];
      if(d.sensitivity!=='' && d.sensitivity!==undefined) props.push(`sensitivity = ${d.sensitivity}`);
      if(d.accel_profile) props.push(`accel_profile = "${d.accel_profile}"`);
      out.push(`hl.device({ ${props.join(', ')} })`);
    });
    out.push('');
  }

  // бинды
  if(repeats.bind.length){
    out.push('---------------------\n---- KEYBINDINGS ----\n---------------------');
    repeats.bind.forEach(b=>{
      const keys = [...b.mods, b.key].filter(Boolean).join(' + ');
      const dinfo = DISPATCHERS.find(d=>d[0]===b.disp) || DISPATCHERS[0];
      const call = dinfo[1].replace('__ARG__', b.arg||'');
      let flagObj = '';
      if(b.flags.length){
        const parts = b.flags.map(fl=> fl==='mouse' ? 'mouse = true' : `${fl} = true`);
        flagObj = `, { ${parts.join(', ')} }`;
      }
      out.push(`hl.bind("${keys}", ${call}${flagObj})`);
    });
    out.push('');
  }

  // window rules
  if(repeats.windowrule.length){
    out.push('----------------------\n---- WINDOW RULES ----\n----------------------');
    repeats.windowrule.forEach(w=>{
      if(!w.name) return;
      let extra = w.value ? `${w.type} = "${w.value}",` : `${w.type} = true,`;
      out.push(`hl.window_rule({\n    name = "${w.name}",\n    match = { ${w.match} },\n    ${extra}\n})`);
    });
    out.push('');
  }

  // workspace rules
  if(repeats.workspacerule.length){
    out.push('-------------------------\n---- WORKSPACE RULES ----\n-------------------------');
    repeats.workspacerule.forEach(w=>{
      if(!w.workspace) return;
      let props = [`workspace = "${w.workspace}"`];
      if(w.monitor) props.push(`monitor = "${w.monitor}"`);
      if(w.gaps_in!=='') props.push(`gaps_in = ${w.gaps_in}`);
      if(w.gaps_out!=='') props.push(`gaps_out = ${w.gaps_out}`);
      if(w.default) props.push(`default = true`);
      if(w.no_border) props.push(`no_border = true`);
      if(w.no_rounding) props.push(`no_rounding = true`);
      if(!w.decorate) props.push(`decorate = false`);
      out.push(`hl.workspace_rule({ ${props.join(', ')} })`);
    });
    out.push('');
  }

  // layer rules
  if(repeats.layerrule.length){
    out.push('----------------------\n---- LAYER RULES ----\n----------------------');
    repeats.layerrule.forEach(l=>{
      if(!l.namespace) return;
      let props = [`name = "${l.namespace.replace(/[^a-zA-Z0-9]/g,'')||'rule'}"`, `match = { namespace = "${l.namespace}" }`];
      if(l.no_anim) props.push(`no_anim = true`);
      if(l.blur) props.push(`blur = true`);
      if(l.dim_around) props.push(`dim_around = true`);
      out.push(`hl.layer_rule({ ${props.join(', ')} })`);
    });
    out.push('');
  }

  const text = out.join('\n');
  document.getElementById('out').textContent = text;
  const n = Object.values(state.on).filter(Boolean).length +
    Object.values(repeats).reduce((a,r)=>a+r.length,0);
  document.getElementById('stat').textContent = n + ' опций/строк включено';
  window._generated = text;
}

document.getElementById('copyBtn').onclick = ()=>{
  navigator.clipboard.writeText(window._generated||'').then(()=>{
    const b=document.getElementById('copyBtn'); const old=b.textContent; b.textContent='Copied!';
    setTimeout(()=>b.textContent=old,1200);
  });
};
document.getElementById('dlBtn').onclick = ()=>{
  const blob = new Blob([window._generated||''],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hyprland.lua'; a.click();
};

build();
</script>
